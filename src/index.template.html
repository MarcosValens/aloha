<!DOCTYPE html>
<html>
  <head>
    <!-- Cookie Consent by https://www.CookieConsent.com -->
    <script
      type="text/javascript"
      src="//www.cookieconsent.com/releases/4.0.0/cookie-consent.js"
      charset="UTF-8"
    ></script>
    <script type="text/javascript" charset="UTF-8">
      document.addEventListener("DOMContentLoaded", function() {
        cookieconsent.run({
          notice_banner_type: "simple",
          consent_type: "express",
          palette: "dark",
          language: "es",
          page_load_consent_levels: ["strictly-necessary"],
          notice_banner_reject_button_hide: false,
          preferences_center_close_button_hide: false,
          website_name: "www.alohagrowshop.com",
          website_privacy_policy_url:
            "https://www.alohagrowshop.com/privacy-policy",
          open_preferences_center_selector: "#open"
        });
      });
    </script>

    <!-- GoogleAnalytics -->
    <script
      type="text/plain"
      cookie-consent="tracking"
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-7RDT3RL9SW"
    ></script>
    <script type="text/plain" cookie-consent="tracking">
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-7RDT3RL9SW");
    </script>
    <!-- end of GoogleAnalytics-->

    <noscript
      >ePrivacy and GPDR Cookie Consent by
      <a href="https://www.CookieConsent.com/" rel="nofollow noopener"
        >Cookie Consent</a
      ></noscript
    >
    <!-- End Cookie Consent by https://www.CookieConsent.com -->
    <title><%= productName %></title>

    <meta charset="ISO-8859-1" />
    <meta name="description" content="<%= productDescription %>" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="128x128"
      href="statics/icons/favicon-128x128.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="statics/icons/favicon-96x96.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="statics/icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="statics/icons/favicon-16x16.png"
    />
    <link rel="icon" type="image/ico" href="statics/icons/favicon.ico" />
  </head>
  <body>
    <!-- DO NOT touch the following DIV -->
    <div id="q-app"></div>
  </body>
</html>
